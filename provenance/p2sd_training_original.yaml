run:
  output_root: runs
  run_id: 0058_p2sd_joint_dense_ps160_warm0033_e150
  lineage_reason:
    0058: "joint training \u2014 encoder unfrozen (stem 1e-5 / enc 3e-5) with 0022's\
      \ dense head on 160^3 context crops (ignore-masked BCE+Dice) + P2SD latent MSE\
      \ / aux MSE / same-sheet consistency 0.5 / different-sheet contrast 0.25; warm\
      \ 0033 + 0022; 150 ep with sub16 GT milestones (user directive 2026-08-26)"
data:
  dataset_root: datasets/vesuvius554_raw_clean_t6
  patch_size:
  - 320
  - 320
  - 320
  erased_border_width: 5
  min_component_voxels: 2000
  component_select_mode: random
  randomize_each_access: true
  seed: 42
  prompt:
    num_positive_points: 8
    num_negative_points: 0
  augmentation:
    flip_p: 0.5
    xy_rotate_p: 0.5
    xy_rand_rotate_p: 0.0
    photometric:
      gaussian_noise_p: 0.3
      gaussian_noise_std:
      - 0.01
      - 0.1
      intensity_p: 0.3
      intensity_scale:
      - 0.9
      - 1.1
      intensity_shift:
      - -0.1
      - 0.1
      gamma_p: 0.2
      gamma:
      - 0.8
      - 1.2
      device: cuda
    translation_max_pad_voxels: 32
    translation_p: 0.2
  load_ignore: true
target_ae:
  config_path: runs/0032_ae_t6_denoise_repel_e150_r1/resolved_config.yaml
  checkpoint_path: runs/0032_ae_t6_denoise_repel_e150_r1/last.pt
  trainable: false
  deduplicate_frozen_pair_targets: true
p2sd:
  image_channels: 1
  encoder_channels:
  - 16
  - 32
  - 96
  - 192
  - 384
  - 512
  image_context:
    type: self_attn
    depth: 4
    pos_encoding: rope
    rope_mode: per_axis
  prompt_composition:
    sampler:
      n_pos: 8
      n_neg: 0
      neg_source: background_or_other_sheet
      n_pos_range:
      - 1
      - 8
    type: point_feature_mlp
    point_pe: fourier
    point_pe_num_bands: 8
    sampled_feature: image_tokens_trilinear
    fusion: none
  prompt_modulator:
    type: prefix_attn
    merge: concat
  refiner:
    type: self_attn
    dim: 512
    depth: 4
    heads: 8
    pos_encoding: rope
    mlp: swiglu
    attention: sdpa
    mlp_ratio: 4.0
  loss:
    per_round_mse_weights:
    - 0
    - 0.5
    - 1
    - 1
    decoded_bce_weight: 0.0
    decoded_bce_interval_steps: 256
    decoded_bce_warmup_steps: 0
    decoded_pos_weight: auto
    decoded_max_auto_pos_weight: 24
    same_sheet_prompt_consistency_weight: 0.5
    latent_normalization:
      enabled: true
      mode: global_channel
      predict_normalized: true
      stats_path: runs/0032_ae_t6_denoise_repel_e150_r1/latent_stats_p2sd_ps320_train64_vark_newae.json
      eps: 1.0e-06
    per_round_mse_weights_mode: original
    coordinate_query:
      enabled: false
      weight: 0.0
      num_points: 8192
      smooth_l1_beta: 0.1
      sampling: balanced_regions
      band_voxels: 8.0
      inside_fraction: 0.3333333333333333
      near_outside_fraction: 0.3333333333333333
    different_sheet_prompt_contrast_weight: 0.25
    different_sheet_prompt_contrast_margin: 1.0
  pair_sampling:
    pairs_per_step: 4
    sample_with_replacement: true
    min_voxels_per_sheet: 1000
    selection_mode: uniform
    max_components_per_sample: 2
    component_select_mode: random
  encoder_stem: patchify
  encoder_patch_size: 4
  encoder_patch_stem: early_conv
  freeze_image_encoder: false
  freeze_image_encoder_through_stage: -1
  dense_aux:
    weight: 1.0
    crop_grid: 5
    bce_weight: 1.0
    dice_weight: 1.0
    pos_weight: 2.0
    init_checkpoint: runs/0022_binseg_ps320_ctxattn4_rope_frozen0021_ft200/last.pt
    decoder_channels:
    - 512
    - 256
    - 128
    - 64
    - 32
    - 16
    num_groups: 8
    dropout: 0.0
    refiner:
      depth: 4
      heads: 8
      mlp_ratio: 4.0
      rope_mode: per_axis
metrics:
  threshold: 0.5
  tolerance_voxels:
  - 1
  - 2
  distance_backend: gpu_cucim
  erased_border_width: 5
  eval_batches: 79
  val_min_target_voxels: 10000
  max_components: 1
  min_largest_component_fraction: 0.9
  min_prompt_component_recall: 0.5
  max_floating_artifact_fraction: 0.2
  max_border_artifact_fraction: 0.0
  max_missing_block_fraction: 0.75
  max_thickness_excess_fraction: 2.0
  log_ae_recon: true
  floating_artifact_component_min_voxels: 100
  parallel_workers: 4
  parallel_max_in_flight: 8
visualization:
  save_png: true
  keep_latest_val_png: 4
  milestone_epochs:
  - 500
  - 1000
  - 1500
  - 2000
  - 2500
  - 3000
  save_3d: true
  save_3d_on_milestones_only: true
  milestone_save_3d: true
  save_3d_max_points: 200000
  keep_latest_val_3d: 4
  probes:
    enabled: false
    manifest_path: research/probes/vesuvius554_ps320_fixed_4pos_prompts_v1.json
    split: val
    batch_size: 1
    num_workers: 0
    eval_interval_epochs: 500
    evaluate_at_milestones: true
    max_rendered_sheets: 16
    milestone_max_rendered_sheets: 32
    render_prompt_sets_per_sheet: 2
    milestone_render_prompt_sets_per_sheet: 4
    keep_latest_png: 4
    keep_latest_metrics: 8
    save_3d: true
  save_train_batch: true
  train_batch_interval_steps: 1770
  train_batch_max_items: 8
  keep_latest_train_batch: 16
optimizer:
  name: adamw
  weight_decay: 0.02
  groups:
  - name: stem
    selector: p2sd.image_encoder.stem.*
    lr: 1.0e-05
  - name: encoder
    selector: p2sd.image_encoder.encoder.*
    lr: 3.0e-05
  - name: dense
    selector: dense_*
    lr: 0.0001
  - name: default
    selector: '*'
    lr: 5.0e-05
  schedule:
    name: cosine
    warmup_steps: 500
    min_lr_scale: 0.0
training:
  batch_size: 1
  num_workers: 8
  persistent_workers: true
  prefetch_factor: 4
  epochs: 150
  max_steps: -1
  amp_dtype: bfloat16
  channels_last_3d: true
  cudnn_benchmark: true
  matmul_precision: high
  compile:
    model: false
    target_ae_encode: false
    mode: reduce-overhead
    fullgraph: false
  log_interval_epochs: 1
  eval_interval_epochs: 500
  save_interval_epochs: 1
  eval_on_last_step: true
  save_on_last_step: true
  reset_step_on_resume: true
  reset_best_on_resume: false
  grad_clip: 1.0
  log_param_dynamics: true
  resume_checkpoint_path: runs/0033_p2sd_vark_fusionnone_newae_ft500/last.pt
  resume_optimizer: false
seed: 42
device: cuda
logging:
  print_model: true
  print_target_ae_model: false
scene_eval:
  enabled: true
  manifest_path: research/probes/vesuvius554_ps320_scene_sub16_8pos_10k_v1.json
  interval_epochs: 50
  target_contract: eligible_only
  evaluation_mode: full
  parallel: 3
  prompt_batch_size: 8
  cpu_workers: 4
